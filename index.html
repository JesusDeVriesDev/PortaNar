<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>PortaNar — Portavasos con identidad nariñense</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <div id="view-inicio-slot"></div>
  <div id="view-historia-slot"></div>
  <div id="view-tipos-slot"></div>
  <div id="view-impacto-slot"></div>
</div>

<nav id="tabbar">
  <button data-goto="inicio" class="active">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    Inicio
  </button>
  <button data-goto="historia">
    <svg viewBox="0 0 24 24"><path d="M4 4h11a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4V4Z"/><path d="M8 9h7M8 13h5"/></svg>
    Historia
  </button>
  <button data-goto="tipos">
    <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.4"/><circle cx="16" cy="8" r="3.4"/><circle cx="8" cy="16" r="3.4"/><circle cx="16" cy="16" r="3.4"/></svg>
    Tipos
  </button>
  <button data-goto="impacto">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>
    Impacto
  </button>
  <button id="tab-ar" class="cam" style="position:relative;">
    <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>
    Escanear
    <span class="dot"></span>
  </button>
</nav>

<div id="sheet-backdrop"></div>
<div class="sheet" id="detail-sheet"></div>

<div id="ar-wrap-slot"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
